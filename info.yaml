# Tiny Tapeout project information
project:
  title:        "SPI Flash Tone Generator"
  author:       "Jerson Quintero"
  discord:      ""
  description:  "Musical tone generator that reads note sequences from W25Q32 Flash memory via SPI and generates PWM audio. Supports 3 songs selectable via debounced push buttons."
  language:     "Verilog"
  clock_hz:     10000000
  tiles: "1x2"
  top_module:  "tt_um_tone_gen_spi"
  source_files:
    - "project.v"
    - "top_music.v"
    - "sequencer.v"
    - "spi_controller.v"
    - "tone_generator.v"
    - "note_table.v"
pinout:
  ui[0]: "btn_play - Play button"
  ui[1]: "btn_stop - Stop button"
  ui[2]: "btn_next - Next song button"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  uo[0]: "audio_out - PWM audio output"
  uo[1]: "spi_cs_n - SPI Flash chip select"
  uo[2]: "spi_sclk - SPI Flash clock"
  uo[3]: "spi_mosi - SPI Flash data output"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""
  uio[0]: "spi_miso - SPI Flash data input"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
yaml_version: 6